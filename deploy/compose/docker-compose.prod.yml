services:
  portal-backend:
    image: ${BACKEND_IMAGE}
    container_name: poprog-portal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/poprog_kb
      DB_USER: ${POPROG_DB_USER}
      DB_PASSWORD: ${POPROG_DB_PASSWORD}
      SEARCH_ENABLED: "true"
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      FILES_STORAGE_DIR: /app/storage
      FILES_BASE_URL: /files
      GIGACHAT_ENABLED: "false"
      KEYCLOAK_AUTH_ENABLED: ${KEYCLOAK_AUTH_ENABLED:-true}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://95.174.95.251}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://95.174.95.251/realms/reflex-ide}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://95.174.95.251/realms/reflex-ide/protocol/openid-connect/certs}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-reflex-ide}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-reflex-web-client}
      KEYCLOAK_REQUIRED_AUDIENCE: ${KEYCLOAK_REQUIRED_AUDIENCE:-}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-master}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      AUTH_DEV_HEADERS_ENABLED: ${AUTH_DEV_HEADERS_ENABLED:-false}
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - portal_backend_storage:/app/storage
    networks:
      - auth_ride

volumes:
  portal_backend_storage:

networks:
  auth_ride:
    external: true
    name: auth-ride_default
