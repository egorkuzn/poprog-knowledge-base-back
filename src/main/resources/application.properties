spring.application.name=poprog-knowledge-base-back
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poprog_kb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
app.search.enabled=${SEARCH_ENABLED:true}
spring.data.elasticsearch.repositories.enabled=${app.search.enabled:false}
management.health.elasticsearch.enabled=${SEARCH_ENABLED:true}
app.files.storage-dir=${FILES_STORAGE_DIR:storage}
app.files.base-url=${FILES_BASE_URL:/api/files}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.gigachat.enabled=${GIGACHAT_ENABLED:false}
app.gigachat.auth-url=${GIGACHAT_AUTH_URL:https://ngw.devices.sberbank.ru:9443}
app.gigachat.api-url=${GIGACHAT_API_URL:https://gigachat.devices.sberbank.ru}
app.gigachat.authorization-key=${GIGACHAT_AUTHORIZATION_KEY:}
app.gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
app.gigachat.model=${GIGACHAT_MODEL:GigaChat}
app.gigachat.trust-store-path=${GIGACHAT_TRUST_STORE_PATH:}
app.gigachat.trust-store-password=${GIGACHAT_TRUST_STORE_PASSWORD:}
app.gigachat.trust-store-type=${GIGACHAT_TRUST_STORE_TYPE:PKCS12}
app.auth.dev-headers.enabled=${AUTH_DEV_HEADERS_ENABLED:false}
app.auth.dev-headers.subject-header=${AUTH_DEV_HEADERS_SUBJECT_HEADER:subject}
app.auth.dev-headers.email-header=${AUTH_DEV_HEADERS_EMAIL_HEADER:email}
app.auth.dev-headers.name-header=${AUTH_DEV_HEADERS_NAME_HEADER:name}
app.auth.dev-headers.roles-header=${AUTH_DEV_HEADERS_ROLES_HEADER:roles}
app.auth.dev-headers.allowed-profiles=${AUTH_DEV_HEADERS_ALLOWED_PROFILES:local,dev}
