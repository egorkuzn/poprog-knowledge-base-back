name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/poprog-knowledge-base-back

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build
        run: ./gradlew bootJar --no-daemon

  docker-deploy:
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose template
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/compose/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/poprog-portal-backend/docker-compose.yml"

      - name: Upload GigaChat runtime env
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
          GIGACHAT_AUTH_URL: ${{ secrets.GIGACHAT_AUTH_URL }}
          GIGACHAT_API_URL: ${{ secrets.GIGACHAT_API_URL }}
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          GIGACHAT_MODEL: ${{ secrets.GIGACHAT_MODEL }}
          GIGACHAT_TRUST_STORE_PASSWORD: ${{ secrets.GIGACHAT_TRUST_STORE_PASSWORD }}
          GIGACHAT_TRUST_STORE_TYPE: ${{ secrets.GIGACHAT_TRUST_STORE_TYPE }}
          GIGACHAT_TRUST_STORE_BASE64: ${{ secrets.GIGACHAT_TRUST_STORE_BASE64 }}
        run: |
          if [ -z "$GIGACHAT_AUTHORIZATION_KEY" ]; then
            echo "::error::GIGACHAT_AUTHORIZATION_KEY secret is required to enable GigaChat in production"
            exit 1
          fi
          if [ -z "$GIGACHAT_TRUST_STORE_BASE64" ]; then
            echo "::error::GIGACHAT_TRUST_STORE_BASE64 secret is required for production GigaChat TLS"
            exit 1
          fi
          cat > gigachat.env <<EOF
          GIGACHAT_ENABLED=true
          GIGACHAT_AUTH_URL=${GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443}
          GIGACHAT_API_URL=${GIGACHAT_API_URL:-https://gigachat.devices.sberbank.ru}
          GIGACHAT_AUTHORIZATION_KEY=${GIGACHAT_AUTHORIZATION_KEY}
          GIGACHAT_SCOPE=${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
          GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat}
          GIGACHAT_TRUST_STORE_PATH=/app/secrets/gigachat-truststore.p12
          GIGACHAT_TRUST_STORE_PASSWORD=${GIGACHAT_TRUST_STORE_PASSWORD}
          GIGACHAT_TRUST_STORE_TYPE=${GIGACHAT_TRUST_STORE_TYPE:-PKCS12}
          EOF
          printf '%s' "$GIGACHAT_TRUST_STORE_BASE64" > gigachat-truststore.p12.b64
          scp -i ~/.ssh/deploy_key gigachat.env "$DEPLOY_USER@$DEPLOY_HOST:/tmp/poprog-gigachat.env"
          scp -i ~/.ssh/deploy_key gigachat-truststore.p12.b64 "$DEPLOY_USER@$DEPLOY_HOST:/tmp/poprog-gigachat-truststore.p12.b64"

      - name: Deploy backend only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "BACKEND_IMAGE='$IMAGE' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/poprog-portal-backend
          test -f .env
          mkdir -p secrets
          if [ ! -s /tmp/poprog-gigachat-truststore.p12.b64 ]; then
            echo "GigaChat trust store artifact was not uploaded" >&2
            exit 1
          fi
          base64 -d /tmp/poprog-gigachat-truststore.p12.b64 > secrets/gigachat-truststore.p12
          rm -f /tmp/poprog-gigachat-truststore.p12.b64
          chmod 600 secrets/gigachat-truststore.p12
          python3 - <<'PY'
          from pathlib import Path

          target = Path(".env")
          fragment = Path("/tmp/poprog-gigachat.env")
          if not fragment.exists():
              raise SystemExit("GigaChat env fragment was not uploaded")

          updates = {}
          for line in fragment.read_text().splitlines():
              if not line or line.lstrip().startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              updates[key] = value

          lines = target.read_text().splitlines()
          output = []
          seen = set()
          for line in lines:
              if line and not line.lstrip().startswith("#") and "=" in line:
                  key = line.split("=", 1)[0]
                  if key in updates:
                      output.append(f"{key}={updates[key]}")
                      seen.add(key)
                      continue
              output.append(line)

          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")

          target.write_text("\n".join(output) + "\n")
          fragment.unlink()
          PY
          chmod 600 .env
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          BACKEND_IMAGE="$BACKEND_IMAGE" docker compose pull portal-backend
          existing_container_id="$(docker ps -aq --filter 'name=^/poprog-portal-backend$')"
          if [ -n "$existing_container_id" ]; then
            docker rm -f "$existing_container_id"
          fi
          BACKEND_IMAGE="$BACKEND_IMAGE" docker compose up -d portal-backend
          for attempt in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:18082/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          docker logs --tail=160 poprog-portal-backend >&2
          exit 1
          REMOTE

      - name: Public smoke check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          dump_backend_logs() {
            echo "::group::Sanitized backend logs"
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker logs --tail=220 poprog-portal-backend 2>&1" \
              | grep -E 'GigaChat|gigachat|PKIX|SSL|certificate|OAuth|oauth|RestClient|HttpClient|Exception|ERROR|WARN|assistant' \
              | sed -E 's/(Authorization: Basic )[A-Za-z0-9+\/=._-]+/\1***MASKED***/g; s/(GIGACHAT_AUTHORIZATION_KEY=).*/\1***MASKED***/g; s/(password[=: ]+)[^ ]+/\1***MASKED***/Ig' \
              || true
            echo "::endgroup::"
          }

          curl -fsS "http://$DEPLOY_HOST/actuator/health" | grep '"status":"UP"'
          curl -fsS "http://$DEPLOY_HOST/api/publications/grouped" >/dev/null
          assistant_response="$(curl -fsS -X POST "http://$DEPLOY_HOST/api/assistant/chat" \
            -H 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Ответь коротко: проверка GigaChat."}]}')" || {
              dump_backend_logs
              exit 1
            }
          echo "$assistant_response" | grep -v '"model":"local-fallback"' || {
            dump_backend_logs
            exit 1
          }
